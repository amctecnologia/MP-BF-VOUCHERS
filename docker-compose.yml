services:
  frontend:
    build: ./frontend
    networks:
      - internal
      - traefik-public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.mp-bf-vouchers-frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.mp-bf-vouchers-frontend.entrypoints=websecure
      - traefik.http.routers.mp-bf-vouchers-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.mp-bf-vouchers-frontend.loadbalancer.server.port=80

  backend:
    build: ./backend
    networks:
      - internal
      - traefik-public
    volumes:
      - uploads:/app/uploads
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_GROUP_ADMIN: ${LDAP_GROUP_ADMIN:-BF-VC-ADMIN}
      LDAP_GROUP_VENDAS: ${LDAP_GROUP_VENDAS:-BF-VC-VENDAS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-10}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.mp-bf-vouchers-backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.mp-bf-vouchers-backend.entrypoints=websecure
      - traefik.http.routers.mp-bf-vouchers-backend.tls.certresolver=letsencrypt
      - traefik.http.services.mp-bf-vouchers-backend.loadbalancer.server.port=3000

  postgres:
    image: postgres:16-alpine
    networks:
      - internal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
